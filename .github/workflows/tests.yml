name: Test

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
        
    - name: Verify jq installation
      run: jq --version
        
    - name: Install jq-forensics profile
      run: bash scripts/install.sh
      
    - name: Run test suite
      run: bash tests/runner.sh
