name: Tests

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install jq
      run: |
        # Install latest jq from official source
        JQ_VERSION="1.7.1"
        wget -q -O jq https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64
        chmod +x jq
        sudo mv jq /usr/local/bin/
        
    - name: Verify jq installation
      run: |
        jq --version
        echo "jq location: $(which jq)"
        echo "Testing jq with a simple command:"
        echo '{"test": true}' | jq .
      
    - name: Debug - List files
      run: |
        echo "Project structure:"
        ls -la
        echo ""
        echo "Source files:"
        ls -la src/
        echo ""
        echo "Test files:"
        ls -la tests/
      
    - name: Validate forensics.jq
      run: |
        echo "Testing forensics.jq with empty input..."
        echo "null" | jq -L . -f forensics.jq || echo "Error loading forensics.jq"
      
    - name: Validate tests.jq syntax
      run: |
        echo "Testing if tests.jq can be parsed..."
        jq -L . -f forensics.jq -f tests/tests.jq empty 2>&1 || echo "Error loading tests"
      
    - name: Run test suite
      run: |
        chmod +x tests/runner.sh
        ./tests/runner.sh
