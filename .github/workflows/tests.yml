name: Tests

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
        
    - name: Verify jq installation
      run: jq --version
      
    - name: Debug - List files
      run: |
        echo "Project structure:"
        ls -la
        echo ""
        echo "Source files:"
        ls -la src/
        echo ""
        echo "Test files:"
        ls -la tests/
      
    - name: Validate forensics.jq
      run: |
        echo "Testing forensics.jq with empty input..."
        echo "null" | jq -L . -f forensics.jq || echo "Error loading forensics.jq"
      
    - name: Validate tests.jq syntax
      run: |
        echo "Testing if tests.jq can be parsed..."
        jq -L . -f forensics.jq -f tests/tests.jq empty 2>&1 || echo "Error loading tests"
      
    - name: Run test suite
      run: |
        chmod +x tests/runner.sh
        ./tests/runner.sh
