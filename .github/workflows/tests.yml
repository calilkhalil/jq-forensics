name: Tests

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
        
    - name: Verify jq installation
      run: jq --version
      
    - name: Validate jq syntax
      run: |
        echo "Validating forensics.jq..."
        jq -L . -f forensics.jq empty || true
        echo "Validating tests.jq..."
        jq -L . -f forensics.jq -f tests/tests.jq empty || true
      
    - name: Run test suite
      run: |
        chmod +x tests/runner.sh
        ./tests/runner.sh
